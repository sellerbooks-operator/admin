name: Build SellerBooks Operator Windows Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-operator:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare professional SellerBooks Operator icon
        shell: pwsh
        run: |
          choco install imagemagick --no-progress -y
          magick "windows-operator/installer/SellerBooks-Operator.svg" -background none -define icon:auto-resize=256,128,64,48,32,16 "windows-operator/installer/SellerBooks Operator.ico"

      - name: Restore
        run: dotnet restore windows-operator/SellerBooks.Operator/SellerBooks.Operator.csproj

      - name: Publish self-contained x64
        run: dotnet publish windows-operator/SellerBooks.Operator/SellerBooks.Operator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=false -o windows-operator/publish-operator

      - name: Download WebView2 Evergreen Bootstrapper
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "windows-operator/MicrosoftEdgeWebView2Setup.exe"

      - name: Download Visual C++ x64 Runtime
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://aka.ms/vc14/vc_redist.x64.exe" -OutFile "windows-operator/vc_redist.x64.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-operator/artifacts | Out-Null
          & "C:Program Files (x86)Inno Setup 6ISCC.exe" "windows-operator/installer/SellerBooks-Operator.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SellerBooks-Operator-Setup
          path: windows-operator/artifacts/SellerBooks Operator Setup.exe
          if-no-files-found: error
          retention-days: 30
